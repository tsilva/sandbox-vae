id: vae/vae-000-kl-off

dataset:
  name: fashion_mnist
  root: data

model:
  kind: vae
  hidden_dims: [512, 128]
  latent_dim: 8
  activation: relu
  output_activation: sigmoid

objective:
  kind: vae
  reconstruction: bce
  reconstruction_reduction: sum_per_sample
  beta: 0.0

training:
  epochs: 20
  batch_size: 128
  optimizer: adam
  learning_rate: 0.001
  seed: 0
  device: auto
  num_workers: 0

diagnostics:
  max_latent_points: 2000
  active_kl_threshold: 0.01

