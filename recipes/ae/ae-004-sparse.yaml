id: ae/ae-004-sparse

dataset:
  name: fashion_mnist
  root: data

model:
  kind: ae
  hidden_dims: [512, 128]
  latent_dim: 32
  activation: relu
  output_activation: none

objective:
  kind: ae
  reconstruction: mse
  latent_l1_weight: 0.001

training:
  epochs: 20
  batch_size: 128
  optimizer: adam
  learning_rate: 0.001
  seed: 0
  device: auto
  num_workers: 0

diagnostics:
  max_latent_points: 2000

