id: vqvae/vqvae-001-basic

dataset:
  name: fashion_mnist
  root: data

model:
  kind: vqvae
  hidden_channels: 64
  embedding_dim: 32
  codebook_size: 128
  commitment_weight: 0.25

objective:
  kind: vqvae
  reconstruction: mse

training:
  epochs: 20
  batch_size: 128
  optimizer: adam
  learning_rate: 0.001
  seed: 0
  device: auto
  num_workers: 0

diagnostics:
  max_latent_points: 2000

