  - name: l1-1e-4
    overrides:
      objective.latent_l1_weight: 0.0001
  - name: l1-1e-3
    overrides:
      objective.latent_l1_weight: 0.001
  - name: l1-1e-2
    overrides:
      objective.latent_l1_weight: 0.01
seeds: [0]
evidence:
